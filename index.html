<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title> Pomodoro Timer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">

<button id="pomodoro" class="modeBtn">Pomodoro</button>
<button id="shortBreak" class="modeBtn">Short Break</button>
<button id="longBreak" class="modeBtn">Long Break</button>

<div id="time-display">25:00</div>

<button id="start" class="btn hidden">Start</button>
<button id="pause" class="btn hidden">Pause</button>
<button id="reset" class="btn hidden">Reset</button>
<button id="skip" class="btn hidden">Skip</button>


</div>
<script src="script.js"></script>
</body>

</html>
